name: Validate and publish package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: package-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies and generate lockfile
        run: npm install

      - name: Verify lockfile
        shell: bash
        run: test -f package-lock.json

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

  publish:
    name: Publish to npm
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies and generate lockfile
        run: npm install

      - name: Verify lockfile
        shell: bash
        run: test -f package-lock.json

      - name: Build package
        run: npm run build

      - name: Select next patch version
        shell: bash
        run: |
          current_version=$(node -p "require('./package.json').version")
          latest_version=$(npm view "$(node -p \"require('./package.json').name\")" version 2>/dev/null || true)
          base_version="${latest_version:-$current_version}"

          npm version "$base_version" --no-git-tag-version --allow-same-version
          npm version patch --no-git-tag-version

          echo "Publishing version $(node -p \"require('./package.json').version\")"

      - name: Update lockfile for published version
        run: npm install --package-lock-only

      - name: Publish package
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
